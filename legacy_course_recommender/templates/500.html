{% extends "base.html" %}

{% block title %}Server Error (500) - CourseMatch{% endblock %}

{% block content %}
<div class="py-5 bg-light text-center" style="min-height: 70vh; display: flex; align-items: center;">
    <div class="container">
        <div class="max-w-500 mx-auto">
            <div class="display-1 fw-bold text-danger mb-2">500</div>
            <h3 class="fw-bold mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">
                An unexpected error occurred while processing your request. Please try again or return to the home page.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('home') }}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i> Back to Home
                </a>
                <a href="{{ url_for('recommendations') }}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-stars me-1"></i> Recommendations
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
